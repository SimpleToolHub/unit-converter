<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbly Unit Converter</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); 
        }
        .card { 
            background: white; padding: 30px; border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 90%; max-width: 400px; text-align: center;
        }
        .icon-container {
            width: 70px; height: 70px; margin: 0 auto 15px;
            border-radius: 50%; background-color: #f0f9ff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 2px solid #e0e0e0;
        }
        .icon-container img { width: 80%; height: auto; }
        input, select { 
            width: 100%; padding: 15px; margin: 10px 0; 
            border: 2px solid #e0e0e0; border-radius: 15px; 
            box-sizing: border-box; font-size: 16px;
        }
        #result { 
            background: #f0f9ff; padding: 15px; border-radius: 15px; 
            color: #007bff; font-size: 22px; font-weight: bold; margin-top: 20px;
        }
        /* Ticker Styles */
        .history-ticker {
            width: 100%; overflow: hidden; background: #eefbff;
            margin-top: 20px; padding: 10px 0;
            border-radius: 15px; white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            animation: move 20s linear infinite;
        }
        .ticker-content span { padding: 0 30px; color: #555; font-size: 13px; }
        @keyframes move {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-container">
        <img src="favicon.png" alt="Tool Icon">
    </div>
    <h2>Unit Converter</h2>
    <input type="number" id="inputVal" placeholder="Enter value" oninput="convert()">
    <select id="unitType" onchange="convert()">
        <option value="mToKm">Miles to Km</option>
        <option value="kmToM">Km to Miles</option>
        <option value="kgToLb">Kg to Pounds</option>
        <option value="cToF">Celsius to Fahrenheit</option>
    </select>
    <div id="result">Result: 0</div>
    
    <div class="history-ticker">
        <div class="ticker-content">
            <span>History: 'Mile' comes from Latin 'mille passus' (1,000 paces).</span>
            <span>Fact: Celsius was originally inverted; 0 was boiling and 100 freezing!</span>
            <span>Fact: A pound is exactly 0.45359237 kilograms.</span>
        </div>
    </div>
</div>

<script>
    function convert() {
        const val = parseFloat(document.getElementById('inputVal').value);
        const type = document.getElementById('unitType').value;
        const resDiv = document.getElementById('result');
        if (isNaN(val)) { resDiv.innerText = "Result: 0"; return; }
        let result = 0;
        if (type === "mToKm") result = val * 1.60934;
        else if (type === "kmToM") result = val / 1.60934;
        else if (type === "kgToLb") result = val * 2.20462;
        else if (type === "cToF") result = (val * 9/5) + 32;
        resDiv.innerText = "Result: " + result.toFixed(2);
    }
</script>

</body>
</html>
